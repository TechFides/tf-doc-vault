<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="420"
  viewBox="0 0 1600 420"
  role="img"
  aria-label="Placeholder architecture diagram, deliberately wider than the reading column"
>
  <rect width="1600" height="420" fill="#ffffff" />
  <g
    font-family="ui-sans-serif, system-ui, sans-serif"
    fill="#16202e"
    text-anchor="middle"
  >
    <text x="800" y="46" font-size="20" font-weight="600">
      Order intake, end to end
    </text>
    <text x="800" y="70" font-size="13" fill="#5b6675">
      Every label here is set at 11px, so the diagram is legible only once it is
      magnified
    </text>

    <g stroke="#c9d3e0" stroke-width="1.5" fill="none">
      <path d="M232 190 h64" marker-end="url(#a)" />
      <path d="M472 190 h64" marker-end="url(#a)" />
      <path d="M712 190 h64" marker-end="url(#a)" />
      <path d="M952 190 h64" marker-end="url(#a)" />
      <path d="M1192 190 h64" marker-end="url(#a)" />
      <path d="M624 232 v58 h240 v-58" marker-end="url(#a)" />
    </g>

    <g>
      <rect
        x="32"
        y="150"
        width="200"
        height="80"
        rx="10"
        fill="#eef3fa"
        stroke="#c9d3e0"
      />
      <text x="132" y="182" font-size="14" font-weight="600">Storefront</text>
      <text x="132" y="204" font-size="11" fill="#5b6675">
        Next.js, edge rendered
      </text>

      <rect
        x="296"
        y="150"
        width="176"
        height="80"
        rx="10"
        fill="#eef3fa"
        stroke="#c9d3e0"
      />
      <text x="384" y="182" font-size="14" font-weight="600">API gateway</text>
      <text x="384" y="204" font-size="11" fill="#5b6675">
        Rate limit, authn
      </text>

      <rect
        x="536"
        y="150"
        width="176"
        height="80"
        rx="10"
        fill="#e4f7ef"
        stroke="#9fd9c1"
      />
      <text x="624" y="182" font-size="14" font-weight="600">Order service</text>
      <text x="624" y="204" font-size="11" fill="#5b6675">
        Writes the ledger
      </text>

      <rect
        x="776"
        y="150"
        width="176"
        height="80"
        rx="10"
        fill="#e4f7ef"
        stroke="#9fd9c1"
      />
      <text x="864" y="182" font-size="14" font-weight="600">Payments</text>
      <text x="864" y="204" font-size="11" fill="#5b6675">
        Idempotent capture
      </text>

      <rect
        x="1016"
        y="150"
        width="176"
        height="80"
        rx="10"
        fill="#eef3fa"
        stroke="#c9d3e0"
      />
      <text x="1104" y="182" font-size="14" font-weight="600">Fulfilment</text>
      <text x="1104" y="204" font-size="11" fill="#5b6675">
        Warehouse queue
      </text>

      <rect
        x="1256"
        y="150"
        width="200"
        height="80"
        rx="10"
        fill="#eef3fa"
        stroke="#c9d3e0"
      />
      <text x="1356" y="182" font-size="14" font-weight="600">Notifications</text>
      <text x="1356" y="204" font-size="11" fill="#5b6675">
        Mail, SMS, webhooks
      </text>

      <rect
        x="536"
        y="290"
        width="328"
        height="72"
        rx="10"
        fill="#fdf1e3"
        stroke="#e8c79c"
      />
      <text x="700" y="318" font-size="14" font-weight="600">Event log</text>
      <text x="700" y="340" font-size="11" fill="#5b6675">
        Append only, replayed on reconciliation
      </text>
    </g>
  </g>

  <defs>
    <marker
      id="a"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="6"
      markerHeight="6"
      orient="auto-start-reverse"
    >
      <path d="M0 0 L10 5 L0 10 z" fill="#c9d3e0" />
    </marker>
  </defs>
</svg>
