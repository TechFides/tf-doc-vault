name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: docker
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.event.after }}"
          fi

          if [ -n "$base" ] && git cat-file -e "$base" 2>/dev/null; then
            changed="$(git diff --name-only "$base" "$head")"
          else
            # No usable base (first push on a new branch): treat everything as changed.
            changed="$(git ls-files)"
          fi

          dirs=()
          # Root (standalone repo) and one level deep (offers monorepo).
          for pkg in package.json */package.json; do
            [ -f "$pkg" ] || continue
            grep -q '"docs:validate"' "$pkg" || continue
            dir="$(dirname "$pkg")"

            # Root has no path to scope by (it IS the whole repo): any change
            # counts. A subfolder only counts on a literal-prefix match, not a
            # regex one: "offer.a" as a regex prefix would also match
            # "offerXa/...", since "." means "any character".
            if [ "$dir" = "." ]; then
              matched=true
            else
              matched=false
              prefix="$dir/"
              while IFS= read -r line; do
                [ -z "$line" ] && continue
                if [ "$line" = "$dir" ] || [ "${line#"$prefix"}" != "$line" ]; then
                  matched=true
                  break
                fi
              done <<< "$changed"
            fi

            if [ "$matched" = true ]; then
              dirs+=("\"$dir\"")
            fi
          done

          if [ "${#dirs[@]}" -eq 0 ]; then
            matrix="[]"
          else
            matrix="[$(IFS=,; echo "${dirs[*]}")]"
          fi
          echo "Matrix: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  check:
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    runs-on: docker
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: ${{ matrix.dir }}
      - run: pnpm typecheck
        working-directory: ${{ matrix.dir }}
      - run: pnpm lint
        working-directory: ${{ matrix.dir }}
      - run: pnpm format:check
        working-directory: ${{ matrix.dir }}
      - run: pnpm docs:validate
        working-directory: ${{ matrix.dir }}
      # Mirrors vercel.json's buildCommand, so CI catches a print-time failure
      # (e.g. a broken PDF export) before it only shows up on the Vercel build.
      - run: pnpm docs:print
        working-directory: ${{ matrix.dir }}
      - run: pnpm docs:build
        working-directory: ${{ matrix.dir }}

  # The one stable required-check name: matrix job names vary with the matrix,
  # so branch protection cannot point at `check` directly. Passes on an empty
  # matrix (check is skipped, not failed) — a change outside every doc's
  # tree is not a doc regression.
  result:
    needs: [detect, check]
    if: always()
    runs-on: docker
    steps:
      - run: |
          if [ "${{ needs.detect.result }}" != "success" ]; then
            echo "detect failed"
            exit 1
          fi
          if [ "${{ needs.check.result }}" = "failure" ] || [ "${{ needs.check.result }}" = "cancelled" ]; then
            echo "check failed"
            exit 1
          fi
