name: Setup
description: Shared pnpm + Node.js + dependency-install for the CI jobs. Keeps the verify / unit / smoke jobs DRY.

runs:
  using: composite
  steps:
    - name: 🔧 Setup pnpm
      uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 24
        cache: "pnpm"

    - name: 📦 Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
      env:
        HUSKY: "0"
