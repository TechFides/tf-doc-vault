name: Setup
description: Shared pnpm + Node.js + dependency-install for the CI jobs. Keeps the verify / unit / smoke jobs DRY.

runs:
  using: composite
  steps:
    - name: 🔧 Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: "pnpm"

    - name: 📦 Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
      env:
        LEFTHOOK: "0"
