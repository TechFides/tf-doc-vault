name: 🔍 CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 🔍 Verify
    runs-on: ubuntu-latest
    steps:
      - name: 🔀 Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 🛠 Setup
        uses: ./.github/actions/setup

      - name: ⚖️ Licence check
        run: pnpm licence-check

      - name: 📝 Validate commit messages
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1

      - name: 🎨 Format check
        run: pnpm format:check

      - name: 📏 Lint
        run: pnpm lint

      - name: 🔍 Typecheck
        run: pnpm typecheck

  test-unit:
    name: 🧪 test:unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # needed by vitest-coverage-report-action
    steps:
      - name: 🔀 Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 🛠 Setup
        uses: ./.github/actions/setup

      - name: 🧪 Unit tests
        run: pnpm test:unit:coverage

      - name: 📤 Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: 💬 Comment coverage on PR
        if: always() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@02f3c2e641286b7fa308cd3e430783103ce6103b # v2.12.0

  test-smoke:
    name: 🧪 test:smoke
    runs-on: ubuntu-latest
    steps:
      - name: 🔀 Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 🛠 Setup
        uses: ./.github/actions/setup

      - name: 📦 Pack
        run: pnpm pack --pack-destination /tmp/

      - name: 🎭 Install playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: 🧪 Run smoke suite
        run: pnpm test:smoke

      - name: 📤 Upload playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
