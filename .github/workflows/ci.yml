name: 🔍 CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 🔍 Verify
    runs-on: ubuntu-latest
    steps:
      - name: 🔀 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit-message check resolves the range base..head.
          fetch-depth: 0

      - name: 🛠 Setup
        uses: ./.github/actions/setup

      - name: ⚖️ Licence check
        run: pnpm licence-check

      # The repo's own commitlint, not an action that bundles one: the bundled
      # parser rejects the `type!:` marker the local commit-msg hook accepts.
      - name: 📝 Validate commit messages
        if: github.event_name == 'pull_request'
        run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

      - name: 🎨 Format check
        run: pnpm format:check

      - name: 📏 Lint
        run: pnpm lint

      - name: 🔍 Typecheck
        run: pnpm typecheck

      - name: 🧹 Knip
        run: pnpm knip --reporter symbols --reporter github-actions

      - name: 🌍 Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: 🌍 Terraform validate
        working-directory: infra/terraform
        run: |
          terraform init -backend=false
          terraform validate

      - name: 🐳 Lint docker/Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: docker/Dockerfile
          failure-threshold: error

  test-unit:
    name: 🧪 test:unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # needed by vitest-coverage-report-action
    steps:
      - name: 🔀 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🛠 Setup
        uses: ./.github/actions/setup

      - name: 🧪 Unit tests
        run: pnpm test:unit:coverage

      - name: 📤 Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: 💬 Comment coverage on PR
        if: always() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2.12.2

  test-smoke:
    name: 🧪 test:smoke
    runs-on: ubuntu-latest
    steps:
      - name: 🔀 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🛠 Setup
        uses: ./.github/actions/setup

      - name: 📦 Pack
        run: pnpm pack --pack-destination /tmp/

      - name: 🎭 Install playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: 🧪 Run smoke suite
        run: pnpm test:smoke

      - name: 📤 Upload playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
